<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Starshade</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Almendra+Display&family=Staatliches&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="assets/icons/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#050012" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Starshade" />
  </head>
  <body>
    <div class="background-overlay"></div>

    <div id="main-menu" class="menu">
      <h1>Starshade</h1>
      <h4>- The Cosmic Platformer -</h4>
      <p id="welcome-message" class="welcome-message"></p>
      <button class="menu-button" id="start-button">Play</button>
      <button class="menu-button" id="levels-button">Levels</button>
      <button class="menu-button" id="skins-button">Skins</button>
      <button class="menu-button" id="settings-button">Settings</button>
      <button class="menu-button" id="contact-button">Contact</button>
      <!-- Starshade Logo positioned under options -->
      <img src="starshade.png" alt="Starshade Logo" class="logo" />
    </div>

    <script src="script.js"></script>
  </body>
</html>
