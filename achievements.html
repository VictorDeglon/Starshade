<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Starshade Achievements</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Almendra+Display&family=Staatliches&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="achievements.css" />
    <link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="assets/icons/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#050012" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Starshade" />
  </head>
  <body>
    <!-- Top-corner back button — a quicker way out than scrolling all the
         way down to "Back to Menu" (see achievements.js). -->
    <button id="top-back-button" class="top-back-button" aria-label="Back">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path d="M15 4 L7 12 L15 20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>

    <header class="header">
      <h1>Achievements</h1>
      <div class="achievements-progress" id="achievements-progress">0 / 0 unlocked</div>
    </header>

    <main class="achievements-grid" id="achievements-grid"></main>

    <button class="back-button" id="back-button">Back to Menu</button>

    <script src="skinsData.js"></script>
    <script src="achievementsData.js"></script>
    <script src="achievements.js"></script>
  </body>
</html>
