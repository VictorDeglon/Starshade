<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Starshade</title>
    <link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="assets/icons/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#050012" />
    <!-- Installed-to-home-screen fullscreen (see docs/gameplay.md's Mobile
         section) — iOS Safari ignores manifest.json's display mode
         entirely and instead needs these Apple-specific tags on every
         page for "Add to Home Screen" to launch without browser chrome. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Starshade" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Almendra+Display&family=Staatliches&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="game.css" />
  </head>
  <body>
    <!-- Game Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- Fading Level Text -->
    <div id="levelText" class="fading-text"></div>

    <!-- Coin-earned toast -->
    <div id="coinToast" class="coin-toast"></div>

    <!-- On-screen touch controls — shown only on touch devices (see the
         (pointer: coarse) rule in game.css), positioned for landscape
         play since that's the only orientation the rotate prompt below
         allows through. -->
    <div id="touchControls" class="touch-controls">
      <div class="touch-dpad">
        <button id="touch-left" class="touch-button" aria-label="Move left">&#9664;</button>
        <button id="touch-right" class="touch-button" aria-label="Move right">&#9654;</button>
      </div>
      <button id="touch-jump" class="touch-button touch-jump" aria-label="Jump">&#9650;</button>
    </div>

    <!-- Mobile is side-scrolling, so portrait doesn't work — this blocks
         play until the device is rotated. Pure CSS (see game.css); no JS
         needed since orientation is exactly what a media query is for. -->
    <div id="rotatePrompt" class="rotate-prompt">
      <p>Rotate your device to landscape to play</p>
    </div>

    <!-- Visible pause trigger — Escape does the same thing, but that's not
         discoverable on its own. An inline SVG glyph instead of a unicode
         character so it's crisp and perfectly centered at any size. -->
    <button id="pause-open-button" aria-label="Pause">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
        <rect x="6" y="4" width="4" height="16" rx="1.5" fill="currentColor" />
        <rect x="14" y="4" width="4" height="16" rx="1.5" fill="currentColor" />
      </svg>
    </button>

    <!-- Pause menu (Esc to toggle) -->
    <div id="pauseMenu" class="menu hidden">
      <div class="menu-panel">
        <h1>Paused</h1>
        <button id="resume-button" class="menu-button">Resume</button>
        <button id="pause-settings-button" class="menu-button">Settings</button>
        <button id="pause-levels-button" class="menu-button">Level Map</button>
        <button id="pause-quit-button" class="menu-button">Quit to Menu</button>
      </div>
    </div>

    <!-- Shown when there is no next level to load -->
    <div id="gameCompleteMenu" class="menu hidden">
      <div class="menu-panel">
        <h1>You beat Starshade!</h1>
        <p id="gameCompleteCoins"></p>
        <button id="game-complete-menu-button" class="menu-button">Back to Main Menu</button>
      </div>
    </div>

    <script src="skinsData.js"></script>
    <!--
      Level scripts are NOT included here directly. Each levelN.js file
      assigns its data to `window.platforms`, `window.checkpoints`, etc.
      (plain property assignment, not `const`/`let`) specifically so that
      loadLevel() in game.js can swap in a new levelN.js <script> tag
      in-page, as many times as needed, without ever reloading the whole
      page. A `const`/`let` re-declared by a second <script> tag in the
      same document throws — see docs/architecture.md — but re-assigning
      `window.foo` is just a normal property write and can happen any
      number of times. This is what lets level transitions keep the same
      Audio element (and AudioContext) playing across levels instead of
      the page reload silently cutting the music.
    -->
    <script src="game.js"></script>
  </body>
</html>
