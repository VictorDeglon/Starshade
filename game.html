<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Starshade</title>
    <link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="assets/icons/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#050012" />
    <!-- Installed-to-home-screen fullscreen (see docs/gameplay.md's Mobile
         section) — iOS Safari ignores manifest.json's display mode
         entirely and instead needs these Apple-specific tags on every
         page for "Add to Home Screen" to launch without browser chrome. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Starshade" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Almendra+Display&family=Staatliches&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="game.css" />
    <link rel="stylesheet" href="achievements.css" />
  </head>
  <body>
    <!-- Game Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- Fading Level Text -->
    <div id="levelText" class="fading-text"></div>

    <!-- Coin-earned toast -->
    <div id="coinToast" class="coin-toast"></div>

    <!-- On-screen touch controls — shown only on touch devices (see the
         (pointer: coarse) rule in game.css), positioned for landscape
         play since that's the only orientation the rotate prompt below
         allows through. -->
    <div id="touchControls" class="touch-controls">
      <div class="touch-dpad">
        <button id="touch-left" class="touch-button" aria-label="Move left">
          <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
            <path d="M15 4 L7 12 L15 20" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
        <button id="touch-right" class="touch-button" aria-label="Move right">
          <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
            <path d="M9 4 L17 12 L9 20" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </div>
      <button id="touch-jump" class="touch-button touch-jump" aria-label="Jump">
        <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true">
          <path d="M4 16 L12 6 L20 16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
    </div>

    <!-- Mobile is side-scrolling, so portrait doesn't work — this blocks
         play until the device is rotated. Pure CSS (see game.css); no JS
         needed since orientation is exactly what a media query is for. -->
    <div id="rotatePrompt" class="rotate-prompt">
      <p>Rotate your device to landscape to play</p>
    </div>

    <!-- Visible pause trigger — Escape does the same thing, but that's not
         discoverable on its own. An inline SVG glyph instead of a unicode
         character so it's crisp and perfectly centered at any size. -->
    <button id="pause-open-button" aria-label="Pause">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
        <rect x="6" y="4" width="4" height="16" rx="1.5" fill="currentColor" />
        <rect x="14" y="4" width="4" height="16" rx="1.5" fill="currentColor" />
      </svg>
    </button>

    <!-- Pause menu (Esc to toggle) -->
    <div id="pauseMenu" class="menu hidden">
      <div class="menu-panel">
        <h1>Paused</h1>
        <button id="resume-button" class="menu-button">Resume</button>
        <button id="pause-settings-button" class="menu-button">Settings</button>
        <button id="pause-levels-button" class="menu-button">Level Map</button>
        <button id="pause-achievements-button" class="menu-button">Achievements</button>
        <button id="pause-quit-button" class="menu-button">Quit to Menu</button>
      </div>
    </div>

    <!-- Shown when there is no next level to load -->
    <div id="gameCompleteMenu" class="menu hidden">
      <div class="menu-panel">
        <h1>You beat Starshade!</h1>
        <p id="gameCompleteCoins"></p>
        <button id="game-complete-menu-button" class="menu-button">Back to Main Menu</button>
      </div>
    </div>

    <!-- Settings overlay — opened from the pause menu. Same markup/IDs
         settings.html uses (settings.js is loaded on this page too and
         drives this in place, detecting it's embedded rather than
         navigating away — see settings.js). Styled via game.css's own
         rules (#settingsOverlay ...) rather than loading styles.css,
         which defines a conflicting `.menu`/`.settings` meaning of its
         own for the standalone page. -->
    <div id="settingsOverlay" class="menu hidden">
      <div class="menu-panel">
        <div class="setting-item">
          <h1>Settings</h1>
        </div>

        <div class="setting-item">
          <label for="player-name">Display Name:</label>
          <input type="text" id="player-name" name="player-name" maxlength="20" placeholder="Explorer" />
        </div>

        <div class="setting-item">
          <label for="volume">Sound Volume:</label>
          <input type="range" id="volume" name="volume" min="0" max="100" value="50" />
        </div>

        <div class="setting-item">
          <label for="background-volume">Background Music Volume:</label>
          <input type="range" id="background-volume" name="background-volume" min="0" max="100" value="33" />
        </div>

        <div class="setting-item">
          <label for="difficulty">Difficulty:</label>
          <select id="difficulty" name="difficulty">
            <option value="easy">Easy — slower hazards, forgiving checkpoints</option>
            <option value="normal" selected>Normal</option>
            <option value="hard">Hard — faster hazards, more coins</option>
          </select>
        </div>

        <div class="setting-item">
          <label for="controls">Controls:</label>
          <select id="controls" name="controls">
            <option value="wasd">WASD</option>
            <option value="arrowkeys">Arrow Keys</option>
          </select>
        </div>

        <div class="setting-item">
          <label for="click-to-jump">Click/Tap to Jump:</label>
          <select id="click-to-jump" name="click-to-jump">
            <option value="on" selected>On</option>
            <option value="off">Off</option>
          </select>
        </div>

        <div class="setting-item">
          <label for="keybindings">Key Bindings:</label>
          <button class="edit-button" id="edit-bindings-button">Edit Key Bindings</button>
          <div id="bindings-panel" class="bindings-panel" hidden>
            <div class="binding-row">
              <span class="binding-label">Move Left</span>
              <button class="rebind-button" data-action="left"></button>
            </div>
            <div class="binding-row">
              <span class="binding-label">Move Right</span>
              <button class="rebind-button" data-action="right"></button>
            </div>
            <div class="binding-row">
              <span class="binding-label">Jump</span>
              <button class="rebind-button" data-action="jump"></button>
            </div>
            <p class="bindings-hint">Click a key, then press its replacement.</p>
          </div>
        </div>

        <div class="setting-item">
          <label for="screen-shake">Screen Shake:</label>
          <select id="screen-shake" name="screen-shake">
            <option value="on" selected>On</option>
            <option value="off">Off</option>
          </select>
        </div>

        <button class="menu-button" id="back-button">Back</button>
      </div>
    </div>

    <!-- Level Map overlay — opened from the pause menu. Same node-tree
         rendering levels.html uses (levels.js is loaded on this page too
         and drives this in place — see levels.js). Picking a level here
         starts it instantly in-page (a fade + loadLevel(), the same
         mechanism advancing to the next level already uses) instead of
         navigating through loading.html's fake progress bar. -->
    <div id="levelMapOverlay" class="menu hidden">
      <div class="menu-panel">
        <h1>Level Map</h1>
        <div class="coin-balance" id="coin-balance">0 Coins</div>
        <div class="tree-wrap">
          <svg id="tree-lines" class="tree-lines"></svg>
          <div class="tree-nodes" id="tree-nodes"></div>
        </div>
        <button class="menu-button" id="level-map-back-button">Back</button>
      </div>
    </div>

    <!-- Achievements overlay — opened from the pause menu. Same grid
         achievements.html uses (achievements.js is loaded on this page
         too and drives this in place — see achievements.js). Keeps the
         game's Audio element alive (see architecture.md) the same way
         Settings/Level Map do — navigating to achievements.html directly
         would tear it down and restart the music from silence. -->
    <div id="achievementsOverlay" class="menu hidden">
      <div class="menu-panel">
        <h1>Achievements</h1>
        <div class="achievements-progress" id="achievements-progress">0 / 0 unlocked</div>
        <div class="achievements-grid" id="achievements-grid"></div>
        <button class="menu-button" id="achievements-back-button">Back</button>
      </div>
    </div>

    <script src="skinsData.js"></script>
    <script src="achievementsData.js"></script>
    <!--
      Level scripts are NOT included here directly. Each levelN.js file
      assigns its data to `window.platforms`, `window.checkpoints`, etc.
      (plain property assignment, not `const`/`let`) specifically so that
      loadLevel() in game.js can swap in a new levelN.js <script> tag
      in-page, as many times as needed, without ever reloading the whole
      page. A `const`/`let` re-declared by a second <script> tag in the
      same document throws — see docs/architecture.md — but re-assigning
      `window.foo` is just a normal property write and can happen any
      number of times. This is what lets level transitions keep the same
      Audio element (and AudioContext) playing across levels instead of
      the page reload silently cutting the music.
    -->
    <script src="game.js"></script>
    <!--
      Loaded after game.js specifically — both are wrapped in their own
      IIFE (see each file's top comment) to avoid colliding with game.js's
      top-level names (a few, like DEFAULT_KEY_BINDINGS, are otherwise
      identical), but they still check for window.closeSettingsOverlay /
      window.startLevelFromOverlay etc. to detect they're embedded here
      rather than on their own standalone page, and those only exist once
      game.js has already run.
    -->
    <script src="settings.js"></script>
    <script src="levels.js"></script>
    <script src="achievements.js"></script>
  </body>
</html>
