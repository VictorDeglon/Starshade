<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Starshade Skins</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Almendra+Display&family=Staatliches&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="skins.css" />
    <link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="assets/icons/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#050012" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Starshade" />
  </head>
  <body>
    <header class="header">
      <h1>Starshade Skins</h1>
      <div class="coin-balance" id="coin-balance">0 Coins</div>
    </header>

    <main class="carousel" id="carousel">
      <button class="carousel-arrow" id="prev-button" aria-label="Previous skin">
        &#10094;
      </button>

      <div class="showcase">
        <div class="showcase-track" id="showcase-track">
          <!-- Skin cards are rendered here by skins.js -->
        </div>
      </div>

      <button class="carousel-arrow" id="next-button" aria-label="Next skin">
        &#10095;
      </button>
    </main>

    <div class="dots" id="dots"></div>

    <button class="back-button" id="back-button">Back to Menu</button>

    <script src="skinsData.js"></script>
    <script src="skins.js"></script>
  </body>
</html>
