<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20">
  <!-- Tileable "beacon ray" texture for ordinary checkpoints (see
       game.js's checkpointTexturePattern) — filled inside the checkpoint's
       own circular clip at low opacity over its flat white/green fill, so
       it reads as a faceted glass beacon rather than a plain dot. Same
       "overlay, don't replace the base fill" treatment as platform/hazard
       textures. -->
  <rect width="20" height="20" fill="none" />
  <path d="M10 0 V20 M0 10 H20 M2 2 L18 18 M18 2 L2 18"
        stroke="rgba(255,225,140,0.35)" stroke-width="0.8" />
  <circle cx="10" cy="10" r="3" fill="none" stroke="rgba(255,244,200,0.4)" stroke-width="0.8" />
</svg>
