<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- Tileable "brushed panel" texture for every menu/back/shop button
       across the game (styles.css/game.css/contact.css/levels.css/
       skins.css/achievements.css's `.menu-button`, `.back-button`,
       `.top-back-button`, `.shop-action-button`) — a faint diagonal
       brushed-metal hatch, drawn as a CSS background-image layered under
       the button's existing flat `#1e0f3f` fill so buttons stop reading
       as flat rectangles without changing their color, shape, or size.
       Same low-opacity-overlay-over-flat-fill language as the in-game
       platform/hazard textures. Edges tile seamlessly when repeated. -->
  <rect width="24" height="24" fill="none" />
  <path d="M-6 6 L6 -6 M-6 18 L18 -6 M6 30 L30 6 M18 30 L30 18"
        stroke="rgba(200,180,255,0.10)" stroke-width="3" />
  <path d="M0 0.5 H24 M0 23.5 H24" stroke="rgba(200,180,255,0.14)" stroke-width="1" />
</svg>
