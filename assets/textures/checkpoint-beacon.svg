<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <!-- Checkpoint beacon (see game.js's drawCheckpoints()) — a discrete
       rune-icon drawn with drawImage() and spun with ctx.rotate(), the
       exact same treatment the level-finish Starshade logo already gets,
       replacing the old plain white/green circle. Idle in warm gold;
       drawCheckpoints() layers a green source-atop tint over this once
       reached, same trick the finish logo uses. Baked at a fixed 40x40 so
       it stays crisp at every checkpoint radius the pulse/pop animation
       produces. -->
  <defs>
    <radialGradient id="core" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#fff8e0" />
      <stop offset="55%" stop-color="#ffd24d" />
      <stop offset="100%" stop-color="#c98a12" />
    </radialGradient>
  </defs>
  <!-- outer rune ring: 12 ticks, 4 cardinal diamonds -->
  <circle cx="20" cy="20" r="17.5" fill="none" stroke="#ffe9a8" stroke-width="1.1" opacity="0.8" />
  <g stroke="#ffe9a8" stroke-width="1.4" opacity="0.75">
    <path d="M20 3 V6.4 M20 33.6 V37 M3 20 H6.4 M33.6 20 H37" />
    <path d="M9.6 9.6 L11.8 11.8 M28.2 28.2 L30.4 30.4 M30.4 9.6 L28.2 11.8 M11.8 28.2 L9.6 30.4" stroke-width="1" opacity="0.7" />
  </g>
  <g fill="#fff3cc">
    <path d="M20 1.6 L22 5.2 L20 8.8 L18 5.2 Z" />
    <path d="M38.4 20 L34.8 22 L31.2 20 L34.8 18 Z" />
    <path d="M20 38.4 L18 34.8 L20 31.2 L22 34.8 Z" />
    <path d="M1.6 20 L5.2 18 L8.8 20 L5.2 22 Z" />
  </g>
  <!-- mid facet ring -->
  <polygon points="20,9 28.8,14 28.8,26 20,31 11.2,26 11.2,14"
           fill="none" stroke="#ffcf5c" stroke-width="1.3" opacity="0.85" />
  <!-- inner faceted gem core -->
  <polygon points="20,12 26,20 20,28 14,20" fill="url(#core)" stroke="#fff6d8" stroke-width="1" />
  <path d="M20 12 V28 M14 20 H26 M16.2 15.8 L23.8 24.2 M23.8 15.8 L16.2 24.2"
        stroke="#7a4c00" stroke-width="0.6" opacity="0.55" />
  <circle cx="20" cy="20" r="2.1" fill="#fffdf3" opacity="0.9" />
</svg>
