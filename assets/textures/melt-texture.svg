<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
  <!-- Tileable "cracked, crumbling" texture for melt platforms (see
       game.js's meltTexturePattern) — jagged fracture lines rather than
       the clean panel grid ordinary/ghost platforms use, so a platform
       that's about to give way underfoot reads as "already breaking"
       even before its countdown shake starts. Edges tile seamlessly
       when repeated. -->
  <rect width="36" height="36" fill="none" />
  <path d="M0 4 L6 7 L4 12 L11 15 L9 22 L16 25 L14 32 L20 36"
        stroke="rgba(255,150,40,0.45)" stroke-width="1.3" fill="none" stroke-linejoin="round" />
  <path d="M36 10 L29 13 L31 18 L24 20 L26 27 L18 29"
        stroke="rgba(255,190,90,0.35)" stroke-width="1" fill="none" stroke-linejoin="round" />
  <path d="M6 7 L2 9 M11 15 L15 17 M16 25 L12 27"
        stroke="rgba(255,150,40,0.3)" stroke-width="0.9" fill="none" />
</svg>
