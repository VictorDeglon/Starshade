<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <!-- Claimed checkpoint beacon — its own art, not a tinted copy of
       checkpoint-beacon.svg (see game.js's drawCheckpoints(), which now
       picks between the two images by `checkpoint.reached` instead of
       recoloring one with a source-atop fill). Reads as the gold beacon's
       "bloomed open" state: the closed diamond core has opened into an
        8-point radiant star, the mid ring is now a lit pane of glass
       instead of a bare outline, and the outer ticks have grown into
       short spikes — a device that's actually active, not just a
       different color. drawCheckpoints() spins this counter to the idle
       beacon's own rotation and noticeably faster, plus a continuous
       gentle pulse, so it keeps reading as "energized" long after the
       one-shot claim burst (flash/rings) finishes. Baked at a fixed
       40x40 so it stays crisp at every radius the pulse/pop animation
       produces. -->
  <defs>
    <radialGradient id="claimedCore" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#f4fff0" />
      <stop offset="45%" stop-color="#7dff9a" />
      <stop offset="100%" stop-color="#1a9c3e" />
    </radialGradient>
    <radialGradient id="claimedHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(160,255,180,0.35)" />
      <stop offset="100%" stop-color="rgba(160,255,180,0)" />
    </radialGradient>
  </defs>
  <circle cx="20" cy="20" r="19" fill="url(#claimedHalo)" />
  <!-- outer ring: solid, brighter, with spiked ticks instead of plain lines -->
  <circle cx="20" cy="20" r="17.5" fill="none" stroke="#9dffb0" stroke-width="1.3" opacity="0.9" />
  <g fill="#c8ffd2" opacity="0.9">
    <path d="M20 1.2 L21.4 6.4 L20 8.8 L18.6 6.4 Z" />
    <path d="M38.8 20 L33.6 21.4 L31.2 20 L33.6 18.6 Z" />
    <path d="M20 38.8 L18.6 33.6 L20 31.2 L21.4 33.6 Z" />
    <path d="M1.2 20 L6.4 18.6 L8.8 20 L6.4 21.4 Z" />
  </g>
  <g stroke="#c8ffd2" stroke-width="1.1" opacity="0.65">
    <path d="M9.6 9.6 L11.8 11.8 M28.2 28.2 L30.4 30.4 M30.4 9.6 L28.2 11.8 M11.8 28.2 L9.6 30.4" />
  </g>
  <!-- mid ring: lit glass pane, not a bare outline -->
  <polygon points="20,9 28.8,14 28.8,26 20,31 11.2,26 11.2,14"
           fill="rgba(120,255,150,0.18)" stroke="#8dffa8" stroke-width="1.4" opacity="0.9" />
  <!-- inner core: bloomed 8-point radiant star, replacing the idle beacon's closed diamond -->
  <g transform="translate(20,20)">
    <path d="M0 -11 L2.6 -2.6 L11 0 L2.6 2.6 L0 11 L-2.6 2.6 L-11 0 L-2.6 -2.6 Z" fill="url(#claimedCore)" stroke="#eaffe8" stroke-width="0.8" />
    <path d="M0 -7.5 L1.7 -1.7 L7.5 0 L1.7 1.7 L0 7.5 L-1.7 1.7 L-7.5 0 L-1.7 -1.7 Z"
          transform="rotate(22.5)" fill="rgba(255,255,255,0.55)" />
    <circle r="2.4" fill="#fbfff6" />
  </g>
</svg>
