<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Arcane Reaver skin art (epic, circle). A rune-inscribed magic
       circle — fixed blue palette matching the skin's own established
       hue (hsl(211, ...)). -->
  <defs>
    <radialGradient id="ar-bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="hsl(211, 85%, 78%)" />
      <stop offset="60%" stop-color="hsl(211, 85%, 45%)" />
      <stop offset="100%" stop-color="hsl(211, 70%, 14%)" />
    </radialGradient>
  </defs>
  <circle cx="24" cy="24" r="24" fill="url(#ar-bg)" />
  <circle cx="24" cy="24" r="16" fill="none" stroke="#eaf6ff" stroke-width="1.2" opacity="0.8" />
  <polygon points="24,10 36,31 12,31" fill="none" stroke="#eaf6ff" stroke-width="1.2" opacity="0.75" />
  <g fill="#eaf6ff">
    <circle cx="24" cy="10" r="1.4" />
    <circle cx="36" cy="31" r="1.4" />
    <circle cx="12" cy="31" r="1.4" />
  </g>
  <circle cx="24" cy="24" r="3" fill="#f6fbff" />
</svg>
