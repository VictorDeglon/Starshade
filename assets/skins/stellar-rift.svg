<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Stellar Rift skin art (epic, circle). A jagged star-shaped tear
       with light spilling from the cracks — fixed pink palette matching
       the skin's own established hue (hsl(320, ...)). -->
