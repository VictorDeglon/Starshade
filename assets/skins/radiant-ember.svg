<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Radiant Ember skin art (epic, triangle). A glowing ember crystal
       with inner fire-glow facet lines — fixed indigo-violet palette
       matching the skin's own established hue (hsl(246, ...)). -->
  <defs>
    <linearGradient id="re-bg" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="hsl(246, 85%, 88%)" />
      <stop offset="55%" stop-color="hsl(246, 85%, 60%)" />
      <stop offset="100%" stop-color="hsl(246, 70%, 18%)" />
    </linearGradient>
    <radialGradient id="re-core" cx="50%" cy="60%" r="45%">
      <stop offset="0%" stop-color="#fff6e0" />
      <stop offset="100%" stop-color="hsl(246, 85%, 60%)" stop-opacity="0" />
    </radialGradient>
  </defs>
  <polygon points="24,3 45,45 3,45" fill="url(#re-bg)" />
  <circle cx="24" cy="30" r="12" fill="url(#re-core)" />
  <path d="M24 8 L18 32 L24 40 L30 32 Z" fill="none" stroke="#fff2cc" stroke-width="1.3" opacity="0.85" />
  <path d="M24 14 L24 40 M20 24 L28 24" stroke="#fff2cc" stroke-width="0.8" opacity="0.6" />
</svg>
