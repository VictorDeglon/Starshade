       game's own "beat everything" skin). An 8-point prime-star badge
       echoing the actual Starshade logo motif, white/silver with a thin
       prismatic edge (a few fixed accent facets, not an animated color
       cycle) and a gold ring for prestige. Fixed single palette per
       skinsData.js's `art` docs. -->
