      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#e6dcff" />
      <stop offset="100%" stop-color="#9a8ac2" />
    </radialGradient>
  </defs>
  <rect width="48" height="48" fill="url(#sp-bg)" />
  <circle cx="24" cy="24" r="19" fill="none" stroke="#ffd76a" stroke-width="1.4" opacity="0.85" />
