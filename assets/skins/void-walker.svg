<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Void Walker skin art (legendary, circle). A swirling event-horizon
       portal — near-black core, blue accretion ring, and a few star
       streaks curving inward — on the skin's own established blue
       (hsl(199,...)). Fixed palette, no animation baked into the art
       itself (see skinsData.js's `art`/`animated` docs). -->
  <defs>
    <radialGradient id="vw-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="hsl(199, 60%, 30%)" />
      <stop offset="100%" stop-color="hsl(199, 70%, 10%)" />
    </radialGradient>
    <radialGradient id="vw-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#020306" />
      <stop offset="80%" stop-color="#020306" />
      <stop offset="100%" stop-color="hsl(199, 85%, 60%)" />
    </radialGradient>
  </defs>
  <circle cx="24" cy="24" r="24" fill="url(#vw-bg)" />
  <path d="M8 14 C14 10 20 24 30 22" fill="none" stroke="hsl(199, 90%, 75%)" stroke-width="1.6" opacity="0.7" stroke-linecap="round" />
  <path d="M40 34 C34 38 28 26 18 27" fill="none" stroke="hsl(199, 90%, 75%)" stroke-width="1.3" opacity="0.55" stroke-linecap="round" />
  <circle cx="24" cy="24" r="10" fill="url(#vw-core)" stroke="hsl(199, 90%, 70%)" stroke-width="1.6" />
</svg>
