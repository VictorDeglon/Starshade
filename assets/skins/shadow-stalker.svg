<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Shadow Stalker skin art (legendary, circle). A hooded silhouette
       with two glowing violet eyes peering out of the dark — reads as
       "stealth" at a glance even at the in-game 25x25px size. Fixed
       violet-gray palette matching the skin's own established hue. -->
