<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Skyward Herald skin art (tripleJump ability, square family — see
       skinsData.js's `art` field). A heraldic wings-and-sun motif on a
       warm gold square: two bold upward chevron "wings" meeting under a
       small sunburst, evoking flight/altitude rather than just a color —
       bold shapes on purpose so it still reads at the in-game 25x25px
       size. -->
  <defs>
    <radialGradient id="sh-bg" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#fff3c4" />
      <stop offset="55%" stop-color="#e8a622" />
      <stop offset="100%" stop-color="#6b4c00" />
    </radialGradient>
  </defs>
  <rect width="48" height="48" fill="url(#sh-bg)" />
  <g fill="#fff8e2">
    <path d="M24 14 L38 34 L30 32 L24 22 L18 32 L10 34 Z" />
  </g>
  <path d="M24 14 L34 30 L28 28.5 L24 20 L20 28.5 L14 30 Z" fill="#ffcf5c" opacity="0.9" />
  <g fill="#fffef0">
    <path d="M24 5 L26 11 L24 14 L22 11 Z" />
    <path d="M16 8 L19.5 12 L18 15 L14 12.5 Z" opacity="0.85" />
    <path d="M32 8 L28.5 12 L30 15 L34 12.5 Z" opacity="0.85" />
  </g>
  <circle cx="24" cy="38" r="2" fill="#fff8e2" opacity="0.9" />
</svg>
