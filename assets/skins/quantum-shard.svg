<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Quantum Shard skin art (epic, triangle). A sci-fi circuit-trace
       shard converging on a glowing quantum node — fixed cyan palette
       matching the skin's own established hue (hsl(177, ...)). -->
  <defs>
    <linearGradient id="qs-bg" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="hsl(177, 85%, 85%)" />
      <stop offset="55%" stop-color="hsl(177, 85%, 55%)" />
      <stop offset="100%" stop-color="hsl(177, 70%, 15%)" />
    </linearGradient>
  </defs>
  <polygon points="24,3 45,45 3,45" fill="url(#qs-bg)" />
  <g stroke="#e6fffa" stroke-width="1.1" opacity="0.85" fill="none">
    <path d="M10 40 L18 32 L18 24 L24 20" />
    <path d="M38 40 L30 32 L30 26 L24 20" />
    <path d="M24 44 L24 20" stroke-dasharray="2 2" />
  </g>
  <g fill="#e6fffa">
    <circle cx="18" cy="24" r="1.3" />
    <circle cx="30" cy="26" r="1.3" />
  </g>
  <circle cx="24" cy="20" r="3.2" fill="#f4fffd" />
  <circle cx="24" cy="20" r="6" fill="none" stroke="#c8fff2" stroke-width="1" opacity="0.5" />
</svg>
