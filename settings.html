<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starshade</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Almendra+Display&family=Staatliches&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="starshade.png" type="image/png" />
  </head>
  <body>
    <div class="background-overlay"></div>

    <div id="main-menu" class="settings">
      <header></header>

      <main>
        <div class="setting-item">
          <h2>Settings</h2>
        </div>

        <!-- Sound Volume Control -->
        <div class="setting-item">
          <label for="volume">Sound Volume:</label>
          <input
            type="range"
            id="volume"
            name="volume"
            min="0"
            max="100"
            value="50"
          />
        </div>

        <!-- Background Music Volume Control -->
        <div class="setting-item">
          <label for="background-volume">Background Music Volume:</label>
          <input
            type="range"
            id="background-volume"
            name="background-volume"
            min="0"
            max="100"
            value="33"
          />
        </div>

        <!-- Graphics Quality -->
        <div class="setting-item">
          <label for="graphics">Graphics Quality:</label>
          <select id="graphics" name="graphics">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
            <option value="ultra">Ultra</option>
          </select>
        </div>

        <!-- Controls Option -->
        <div class="setting-item">
          <label for="controls">Controls:</label>
          <select id="controls" name="controls">
            <option value="wasd">WASD</option>
            <option value="arrowkeys">Arrow Keys</option>
            <option value="mouseclicks">Mouse Clicks</option>
          </select>
        </div>

        <!-- Key Bindings -->
        <div class="setting-item">
          <label for="keybindings">Key Bindings:</label>
          <button class="edit-button">Edit Key Bindings</button>
        </div>

        <!-- Screen Resolution -->
        <div class="setting-item">
          <label for="resolution">Screen Resolution:</label>
          <select id="resolution" name="resolution">
            <option value="720p">1280x720 (HD)</option>
            <option value="1080p" selected>1920x1080 (Full HD)</option>
            <option value="1440p">2560x1440 (QHD)</option>
            <option value="4k">3840x2160 (4K)</option>
          </select>
        </div>

        <!-- Back to Menu Button -->
        <button class="menu-button" id="back-button">Back to Menu</button>
      </main>
    </div>
    <!-- External JavaScript -->
    <script src="settings.js"></script>
  </body>
</html>
