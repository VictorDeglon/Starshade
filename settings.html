<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starshade</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Almendra+Display&family=Staatliches&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="assets/icons/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  </head>
  <body>
    <div class="background-overlay"></div>

    <div id="main-menu" class="settings">
      <header></header>

      <main>
        <div class="setting-item">
          <h2>Settings</h2>
        </div>

        <!-- Sound Volume Control -->
        <div class="setting-item">
          <label for="volume">Sound Volume:</label>
          <input
            type="range"
            id="volume"
            name="volume"
            min="0"
            max="100"
            value="50"
          />
        </div>

        <!-- Background Music Volume Control -->
        <div class="setting-item">
          <label for="background-volume">Background Music Volume:</label>
          <input
            type="range"
            id="background-volume"
            name="background-volume"
            min="0"
            max="100"
            value="33"
          />
        </div>

        <!-- Difficulty — actually changes gameplay, see game.js's
             DIFFICULTY_SETTINGS: moving platforms speed up/slow down,
             checkpoints get more/less forgiving to touch, and coin
             rewards scale with the risk. -->
        <div class="setting-item">
          <label for="difficulty">Difficulty:</label>
          <select id="difficulty" name="difficulty">
            <option value="easy">Easy — slower hazards, forgiving checkpoints</option>
            <option value="normal" selected>Normal</option>
            <option value="hard">Hard — faster hazards, more coins</option>
          </select>
        </div>

        <!-- Controls Option -->
        <div class="setting-item">
          <label for="controls">Controls:</label>
          <select id="controls" name="controls">
            <option value="wasd">WASD</option>
            <option value="arrowkeys">Arrow Keys</option>
            <option value="mouseclicks">Mouse Clicks (TBD)</option>
          </select>
        </div>

        <!-- Key Bindings -->
        <div class="setting-item">
          <label for="keybindings">Key Bindings:</label>
          <button class="edit-button" id="edit-bindings-button">Edit Key Bindings</button>
          <div id="bindings-panel" class="bindings-panel" hidden>
            <div class="binding-row">
              <span class="binding-label">Move Left</span>
              <button class="rebind-button" data-action="left"></button>
            </div>
            <div class="binding-row">
              <span class="binding-label">Move Right</span>
              <button class="rebind-button" data-action="right"></button>
            </div>
            <div class="binding-row">
              <span class="binding-label">Jump</span>
              <button class="rebind-button" data-action="jump"></button>
            </div>
            <p class="bindings-hint">Click a key, then press its replacement.</p>
          </div>
        </div>

        <!-- Screen Resolution — not implemented: the canvas always fills the
             browser window (see game.js), so there's no fixed "resolution"
             for this to control without breaking that responsive sizing. -->
        <div class="setting-item">
          <label for="resolution">Screen Resolution: <span class="tbd-tag">(TBD)</span></label>
          <select id="resolution" name="resolution" disabled>
            <option value="auto" selected>Matches window size</option>
          </select>
        </div>

        <!-- Back to Menu Button -->
        <button class="menu-button" id="back-button">Back to Menu</button>
      </main>
    </div>
    <!-- External JavaScript -->
    <script src="settings.js"></script>
  </body>
</html>
