<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Starshade</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Almendra+Display&family=Staatliches&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="assets/icons/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#050012" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Starshade" />
  </head>
  <body>
    <!-- Top-corner back button — a quicker way out than scrolling all the
         way down to "Back to Menu" (see settings.js, which wires this to
         the exact same click handler). -->
    <button id="top-back-button" class="top-back-button" aria-label="Back">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path d="M15 4 L7 12 L15 20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>

    <div class="background-overlay"></div>

    <div id="main-menu" class="settings">
      <header></header>

      <main>
        <div class="setting-item">
          <h2>Settings</h2>
        </div>

        <!-- Display Name — saved locally, used for the "Welcome back"
             greeting on the main menu (see script.js). -->
        <div class="setting-item">
          <label for="player-name">Display Name:</label>
          <input
            type="text"
            id="player-name"
            name="player-name"
            maxlength="20"
            placeholder="Explorer"
          />
        </div>

        <!-- Sound Volume Control -->
        <div class="setting-item">
          <label for="volume">Sound Volume:</label>
          <input
            type="range"
            id="volume"
            name="volume"
            min="0"
            max="100"
            value="50"
          />
        </div>

        <!-- Background Music Volume Control -->
        <div class="setting-item">
          <label for="background-volume">Background Music Volume:</label>
          <input
            type="range"
            id="background-volume"
            name="background-volume"
            min="0"
            max="100"
            value="33"
          />
        </div>

        <!-- Difficulty — actually changes gameplay, see game.js's
             DIFFICULTY_SETTINGS: moving platforms speed up/slow down,
             checkpoints get more/less forgiving to touch, and coin
             rewards scale with the risk. -->
        <div class="setting-item">
          <label for="difficulty">Difficulty:</label>
          <select id="difficulty" name="difficulty">
            <option value="easy">Easy — slower hazards, forgiving checkpoints</option>
            <option value="normal" selected>Normal</option>
            <option value="hard">Hard — faster hazards, more coins</option>
          </select>
        </div>

        <!-- Controls Option -->
        <div class="setting-item">
          <label for="controls">Controls:</label>
          <select id="controls" name="controls">
            <option value="wasd">WASD</option>
            <option value="arrowkeys">Arrow Keys</option>
          </select>
        </div>

        <!-- Click/Tap to Jump — a real, working supplement to the keyboard
             bindings above (not a movement scheme, since a platformer's
             gravity/jump-arc movement isn't sensible to drive with a mouse;
             this only adds jump/double-jump on click or tap). -->
        <div class="setting-item">
          <label for="click-to-jump">Click/Tap to Jump:</label>
          <select id="click-to-jump" name="click-to-jump">
            <option value="on" selected>On</option>
            <option value="off">Off</option>
          </select>
        </div>

        <!-- Key Bindings -->
        <div class="setting-item">
          <label for="keybindings">Key Bindings:</label>
          <button class="edit-button" id="edit-bindings-button">Edit Key Bindings</button>
          <div id="bindings-panel" class="bindings-panel" hidden>
            <div class="binding-row">
              <span class="binding-label">Move Left</span>
              <button class="rebind-button" data-action="left"></button>
            </div>
            <div class="binding-row">
              <span class="binding-label">Move Right</span>
              <button class="rebind-button" data-action="right"></button>
            </div>
            <div class="binding-row">
              <span class="binding-label">Jump</span>
              <button class="rebind-button" data-action="jump"></button>
            </div>
            <p class="bindings-hint">Click a key, then press its replacement.</p>
          </div>
        </div>

        <!-- Screen Shake — a real, scalable effect (unlike the old
             "Graphics Quality"/"Screen Resolution" placeholders, which had
             nothing in a flat 2D canvas renderer for them to actually
             control): toggles the camera-shake/particle-heavy hit-feedback
             in game.js's resetPlayer()/draw() on death, for anyone who
             finds it distracting or motion-sensitive. -->
        <div class="setting-item">
          <label for="screen-shake">Screen Shake:</label>
          <select id="screen-shake" name="screen-shake">
            <option value="on" selected>On</option>
            <option value="off">Off</option>
          </select>
        </div>

        <!-- Back to Menu Button -->
        <button class="menu-button" id="back-button">Back to Menu</button>
      </main>
    </div>
    <!-- External JavaScript -->
    <script src="settings.js"></script>
  </body>
</html>
