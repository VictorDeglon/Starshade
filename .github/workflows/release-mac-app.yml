name: Build & publish macOS app

# Push a tag like v1.0.1 (matching package.json's "version") to build the
# Electron app and attach the .dmg to a GitHub Release. The desktop app's
# update check (electron/main.js) reads this repo's "latest release" via
# the GitHub API, so a release needs to exist here for that to find
# anything.
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Build and publish the .dmg
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
